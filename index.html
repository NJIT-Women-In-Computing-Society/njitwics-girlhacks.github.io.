<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NJIT GIRLHACKS</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: #f5f5f5;
      overflow-x: hidden;
      background: #000;
      cursor: none; 
    }

    /* HERO */
    .hero {
      height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.8)),
        url(assets/landingBackground.png) no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* CONTENT */
    .hero-content {
      max-width: 800px;
      padding: 20px;
      animation: fadeUp 1.5s ease;
      z-index: 2;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 4rem;
      letter-spacing: 3px;
      margin-bottom: -20px;
      text-shadow:
        0 0 10px rgba(173,216,230,0.7),
        0 0 20px rgba(173,216,230,0.5);
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      margin-top: 10px;
      margin-bottom: 20px;
      color: rgba(173,216,230,0.7);
    }

    /* SOCIAL ICONS */
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .social-icons img {
      width: 38px;
      filter: brightness(0) invert(1);
      transition: all 0.3s ease;
    }

    .social-icons a:hover img {
      transform: scale(1.2);
      filter: drop-shadow(0 0 10px #9ddcff);
    }

    /* COUNTDOWN */
    .countdown {
      margin-top: 20px;
      text-align: center;
    }

    .countdown h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.25rem;
      margin-bottom: 10px;
      color: rgba(173,216,230,0.7);
    }

    .countdown-timer {
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .time-unit {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .time-unit span {
      font-family: 'Cinzel', serif;
      font-size: 2.75rem;
      font-weight: bold;
      color: #3d143d;
      padding: 5px 10px;
      border-radius: 10px;
      background: rgba(255,255,255,0.4);
      text-shadow:
        0 0 10px rgba(250,230,255,0.7),
        0 0 20px rgba(250,230,255,0.8);
    }

    .time-unit p {
      font-size: 1rem;
      margin-top: 5px;
      color: #ba79d6;
    }

    /* FLOATING PARTICLES */
    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 70%;
      background: #fff6b0;
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-80px); opacity: 0; }
    }

    /* CURSOR GLOW */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, #fae6ff, #ba79d6, transparent);
      transform: translate(-50%, -50%);
      z-index: 999;
    }

    .trail {
      position: fixed;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ba79d6;
      pointer-events: none;
      animation: fadeTrail 1s linear forwards;
    }

    @keyframes fadeTrail {
      to {
        opacity: 0;
        transform: scale(0.3);
      }
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* GLOWING BUTTON */
    .glow-button {
      display: inline-block;
      padding: 15px 35px;
      font-size: 1.2rem;
      font-family: 'Cinzel', serif;
      font-weight: 500;
      color: #fff;
      text-decoration: none;
      background: linear-gradient(90deg, #3d143d, #ba79d6);
      border: none;
      border-radius: 50px;
      box-shadow: 0 0 20px rgba(186, 121, 214, 0.5);
      transition: all 0.3s ease;
      margin-top: 5px;
      margin-bottom: 20px;
      animation: glowPulse 2s ease-in-out infinite alternate;
    }

    .glow-button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(186, 121, 214, 0.8), 0 0 40px rgba(157, 220, 255, 0.6);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    @keyframes glowPulse {
      from {
        box-shadow: 0 0 20px rgba(186, 121, 214, 0.5);
      }
      to {
        box-shadow: 0 0 30px rgba(186, 121, 214, 0.7), 0 0 40px rgba(157, 220, 255, 0.4);
      }
    }
  </style>
</head>

<body>

  <div class="cursor" id="cursor"></div>

  <section class="hero">

    <!-- PARTICLES -->
    <div id="particles"></div>

    <div class="hero-content">
      <h1>GIRLHACKS 2026</h1>

      <div id="countdown" class="countdown">
        <h2>Countdown to GirlHacks 2026</h2>
        <div class="countdown-timer">
          <div class="time-unit">
            <span id="days">00</span>
            <p>Days</p>
          </div>
          <div class="time-unit">
            <span id="hours">00</span>
            <p>Hours</p>
          </div>
          <div class="time-unit">
            <span id="minutes">00</span>
            <p>Minutes</p>
          </div>
          <div class="time-unit">
            <span id="seconds">00</span>
            <p>Seconds</p>
          </div>
        </div>
      </div>
      <p class="subtitle">OCTOBER 3RD–4TH 2026</p>

      <a href="https://forms.gle/eEKXv5w7SminLwQH9" class="glow-button" target="_blank">Stay Updated</a>

      <div class="social-icons">
        <a href="mailto:wicsnjit@gmail.com"><img src="assets/icons8-email-48.png" /></a>
        <a href="https://www.linkedin.com/company/wicsnjit/posts/?feedView=all"><img src="assets/icons8-linkedin-48.png" /></a>
        <a href="https://discord.com/invite/ZSuqcQaNG6"><img src="assets/icons8-discord-48.png" /></a>
        <a href="https://www.instagram.com/wicsnjit/?hl=en"><img src="assets/icons8-instagram-48.png" /></a>
      </div>

  </section>

  <script>
    // PARTICLES
    const container = document.getElementById("particles");

    function createParticle() {
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = Math.random() * window.innerWidth + "px";
      p.style.top = window.innerHeight * (0.6 + Math.random() * 0.3) + "px";
      p.style.animationDuration = (3 + Math.random() * 3) + "s";
      container.appendChild(p);
      setTimeout(() => p.remove(), 6000);
    }

    setInterval(createParticle, 300);

    // CURSOR
    const cursor = document.getElementById("cursor");

    document.addEventListener("mousemove", (e) => {
      cursor.style.left = e.clientX + "px";
      cursor.style.top = e.clientY + "px";

      const trail = document.createElement("div");
      trail.className = "trail";
      trail.style.left = e.clientX + "px";
      trail.style.top = e.clientY + "px";
      document.body.appendChild(trail);

      setTimeout(() => trail.remove(), 800);
    });

    // COUNTDOWN
    const targetDate = new Date(2026, 9, 3); // October 3, 2026 (months are 0-based)

    function updateCountdown() {
      const now = new Date();
      const timeDifference = targetDate - now;

      if (timeDifference > 0) {
        const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
        const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

        document.getElementById('days').textContent = days.toString().padStart(2, '0');
        document.getElementById('hours').textContent = hours.toString().padStart(2, '0');
        document.getElementById('minutes').textContent = minutes.toString().padStart(2, '0');
        document.getElementById('seconds').textContent = seconds.toString().padStart(2, '0');
      } else {
        // If the date has passed, show 00:00:00:00
        document.getElementById('days').textContent = '00';
        document.getElementById('hours').textContent = '00';
        document.getElementById('minutes').textContent = '00';
        document.getElementById('seconds').textContent = '00';
      }
    }

    // Update countdown every second
    setInterval(updateCountdown, 1000);

    // Initial call
    updateCountdown();
  </script>

</body>
</html>
