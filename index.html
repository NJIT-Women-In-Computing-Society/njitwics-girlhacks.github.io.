<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>NJIT GIRLHACKS</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Cormorant+Garamond:wght@400;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Poppins', sans-serif;
      color: #f5f5f5;
      overflow-x: hidden;
      background: #000;
      cursor: none; 
    }

    /* HERO */
    .hero {
      height: 100vh;
      background:
        linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.8)),
        url(assets/landingBackground.png) no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    /* CONTENT */
    .hero-content {
      max-width: 800px;
      padding: 20px;
      animation: fadeUp 1.5s ease;
      z-index: 2;
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 4rem;
      letter-spacing: 3px;
      margin-bottom: 20px;
      text-shadow:
        0 0 10px rgba(173,216,230,0.7),
        0 0 20px rgba(173,216,230,0.5);
    }

    .subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      margin-bottom: 30px;
    }

    /* SOCIAL ICONS */
    .social-icons {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    .social-icons img {
      width: 38px;
      filter: brightness(0) invert(1);
      transition: all 0.3s ease;
    }

    .social-icons a:hover img {
      transform: scale(1.2);
      filter: drop-shadow(0 0 10px #9ddcff);
    }

    /* FLOATING PARTICLES */
    .particle {
      position: absolute;
      width: 10px;
      height: 10px;
      border-radius: 70%;
      background: #fff6b0;
      animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
      0% { transform: translateY(0); opacity: 0; }
      50% { opacity: 1; }
      100% { transform: translateY(-80px); opacity: 0; }
    }

    /* CURSOR GLOW */
    .cursor {
      position: fixed;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, #fae6ff, #ba79d6, transparent);
      transform: translate(-50%, -50%);
      z-index: 999;
    }

    .trail {
      position: fixed;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #ba79d6;
      pointer-events: none;
      animation: fadeTrail 1s linear forwards;
    }

    @keyframes fadeTrail {
      to {
        opacity: 0;
        transform: scale(0.3);
      }
    }

    /* ANIMATIONS */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(40px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>

<body>

  <div class="cursor" id="cursor"></div>

  <section class="hero">

    <!-- PARTICLES -->
    <div id="particles"></div>

    <div class="hero-content">
      <h1>GIRLHACKS 2026</h1>
      <p class="subtitle">OCTOBER 3RD–4TH 2026</p>

      <div class="social-icons">
        <a href="mailto:wicsnjit@gmail.com"><img src="assets/icons8-email-48.png" /></a>
        <a href="https://www.linkedin.com/company/wicsnjit/posts/?feedView=all"><img src="assets/icons8-linkedin-48.png" /></a>
        <a href="https://discord.com/invite/ZSuqcQaNG6"><img src="assets/icons8-discord-48.png" /></a>
        <a href="https://www.instagram.com/wicsnjit/?hl=en"><img src="assets/icons8-instagram-48.png" /></a>
      </div>
    </div>

  </section>

  <script>
    // PARTICLES
    const container = document.getElementById("particles");

    function createParticle() {
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = Math.random() * window.innerWidth + "px";
      p.style.top = window.innerHeight * (0.6 + Math.random() * 0.3) + "px";
      p.style.animationDuration = (3 + Math.random() * 3) + "s";
      container.appendChild(p);
      setTimeout(() => p.remove(), 6000);
    }

    setInterval(createParticle, 300);

    // CURSOR
    const cursor = document.getElementById("cursor");

    document.addEventListener("mousemove", (e) => {
      cursor.style.left = e.clientX + "px";
      cursor.style.top = e.clientY + "px";

      const trail = document.createElement("div");
      trail.className = "trail";
      trail.style.left = e.clientX + "px";
      trail.style.top = e.clientY + "px";
      document.body.appendChild(trail);

      setTimeout(() => trail.remove(), 800);
    });
  </script>

</body>
</html>
